name: windows-core

on:
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        default: windows-2022
        options: [windows-2022, windows-2025]

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: warmenhoven/tia
          path: tia

      - name: locate visual studio
        id: vs
        shell: cmd
        run: |
          for /f "usebackq delims=" %%P in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do @echo vs=%%P>>%GITHUB_OUTPUT%

      - name: build tia with msvc
        shell: bash
        env:
          VS_PATH: ${{ steps.vs.outputs.vs }}
        run: |
          set -x
          export PATH="/c/msys64/usr/bin:/c/mingw64/bin:$PATH"
          export VsInstallRoot="$(cygpath -u "$VS_PATH")"

          # The runner's make is mingw32-make, a native Windows make. The
          # Makefile rewrites PATH into unix form for MSYS2's make, which
          # CreateProcess cannot parse. A command-line PATH cannot be
          # overridden by the makefile, so set it here in Windows form.
          ver="$(cat "$VsInstallRoot/VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt" | tr -d '[:space:]')"
          clbin="$(cygpath -w "$VsInstallRoot/VC/Tools/MSVC/$ver/bin/HostX64/x64")"
          echo "toolset $ver"
          ls "$(cygpath -u "$clbin")/cl.exe"

          cd tia
          make platform=windows_msvc2017_desktop_x64 -j2 \
               PATH="$clbin;$(cygpath -w /c/msys64/usr/bin);$(cygpath -w /c/mingw64/bin);C:\\Windows\\system32"

      - name: what came out
        if: always()
        shell: bash
        run: ls -l tia/*.dll tia/*.lib 2>/dev/null || echo "(nothing produced)"
