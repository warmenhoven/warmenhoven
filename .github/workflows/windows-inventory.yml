name: windows-inventory

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Which runner image to inventory
        type: choice
        default: windows-2025
        options: [windows-2025, windows-2022, windows-11-arm, windows-latest]

jobs:
  inventory:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: make, anywhere
        shell: cmd
        run: |
          echo === make on PATH ===
          where make 2>nul || echo "make: NOT on PATH"
          echo === msys2 make ===
          if exist C:\msys64\usr\bin\make.exe (echo FOUND C:\msys64\usr\bin\make.exe) else (echo absent: C:\msys64\usr\bin\make.exe)
          if exist C:\msys64\mingw64\bin\mingw32-make.exe (echo FOUND mingw32-make) else (echo absent: mingw32-make)
          echo === git bash ===
          if exist "C:\Program Files\Git\usr\bin\make.exe" (echo FOUND git-bash make) else (echo absent: git-bash make)

      - name: what the Makefiles also need
        shell: cmd
        run: |
          for %%T in (sh.exe bash.exe cygpath.exe sed.exe grep.exe awk.exe) do @(
            if exist C:\msys64\usr\bin\%%T (echo msys2 has %%T) else (echo msys2 MISSING %%T)
          )

      - name: msys2 installed packages
        shell: cmd
        continue-on-error: true
        run: |
          C:\msys64\usr\bin\pacman.exe -Qq

      - name: every visual studio instance
        shell: cmd
        run: |
          echo === all instances (-all, no -latest: -latest hides older ones) ===
          "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -products * -all ^
            -format value -property installationPath
          echo === with versions ===
          "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -products * -all ^
            -format value -property catalog_productDisplayVersion
          echo === visual studio directories on disk ===
          dir /b "C:\Program Files\Microsoft Visual Studio" 2>nul
          dir /b "C:\Program Files (x86)\Microsoft Visual Studio" 2>nul

      - name: msvc toolsets
        shell: cmd
        run: |
          echo === host/target toolsets ===
          for /f "usebackq delims=" %%P in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -products * -all -format value -property installationPath`) do @(
            echo --- %%P ---
            for /d %%V in ("%%P\VC\Tools\MSVC\*") do @(echo toolset %%~nxV & dir /b "%%V\bin")
          )
          echo === windows sdks ===
          dir /b "C:\Program Files (x86)\Windows Kits\10\Include" 2>nul

      - name: other build tools present
        shell: cmd
        continue-on-error: true
        run: |
          cmake --version
          ninja --version
          python --version
